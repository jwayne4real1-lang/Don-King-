# render.yaml
services:
  - type: web
    name: don-king-battles
    env: node
    
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: STRIPE_SECRET_KEY
        sync: false
    healthCheckPath: /api/health
    healthCheckInterval: 30
